# Checks for the room-planner app: types, unit tests and a production build. Runs only when it changes.
name: room-planner
on:
  push:
    branches: [main]
    paths: ['room-planner/**', '.github/workflows/room-planner.yml']
  pull_request:
    paths: ['room-planner/**', '.github/workflows/room-planner.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: room-planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: room-planner/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Publishes to Cloudflare Pages on pushes to main. Does nothing until the repository has the two secrets
  # CLOUDFLARE_API_TOKEN (Pages: Edit permission) and CLOUDFLARE_ACCOUNT_ID.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: room-planner
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        working-directory: .
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "Cloudflare secrets not set; skipping deploy."; fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: room-planner/package-lock.json
      - if: steps.creds.outputs.ok == 'true'
        run: npm ci && npm run build
      - if: steps.creds.outputs.ok == 'true'
        run: npx --yes wrangler@4 pages deploy dist --project-name=room-planner --branch=main --commit-dirty=true
